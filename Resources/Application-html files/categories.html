<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category & Products</title>
    
    <link rel="stylesheet" href="../../Public/Assests/CSS/categories.css">
    <link rel="stylesheet" href="../../Public/Assests/CSS/dashboard.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"> 
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <div class="smds-sidebar">
        <supermarket-side-navigation></supermarket-side-navigation>
    </div>
    
    <!-- Navbar -->
    <div class="smds-content-wrapper">
        <nav class="navbar" style="width:96%;">
            <supermarket-top-navigation style="display:block; width:100%;"></supermarket-top-navigation>
        </nav>
        <div class="smcs-container mt-4">
            <div class="row mr-3">
                <!-- Category Section -->
                <div class="col-md-3">
                    <h4 class="text-success">Categories</h4>
                    <div class="smcs-category-list">
                        <div class="smcs-category-item" data-category="Fruits And Vegetables" id="fruits_vegetables">
                            <i class="fas fa-apple-alt"></i> Fruits & Vegetables</div>
                        <div class="smcs-category-item" data-category="Staples" id="staples">
                            <i class="fas fa-utensils"></i> Staples</div>
                        <div class="smcs-category-item" data-category="Snacks And Namkeens" id="snacks">
                            <i class="fas fa-cookie"></i> Snacks & Namkeens</div>
                        <div class="smcs-category-item" data-category="Beverages" id="beverages">
                            <i class="fas fa-coffee"></i> Beverages</div>
                        <div class="smcs-category-item" data-category="Chilled And Dairy Foods" id="dairy">
                            <i class="fas fa-cheese"></i> Chilled and Dairy Foods</div>
                        <div class="smcs-category-item" data-category="Ready To Cook" id="ready_to_cook">
                            <i class="fas fa-fire"></i> Ready To Cook</div>
                        <div class="smcs-category-item" data-category="Ready To Eat" id="ready_to_eat">
                            <i class="fas fa-utensil-spoon"></i> Ready To Eat</div>
                        <div class="smcs-category-item" data-category="Baby Care" id="baby_care">
                            <i class="fas fa-baby"></i> Baby Care</div>
                        <div class="smcs-category-item" data-category="Household" id="household">
                            <i class="fas fa-home"></i> Household</div>
                        <div class="smcs-category-item" data-category="Feminine Care" id="feminine_care">
                            <i class="fas fa-female"></i> Feminine Care</div>
                        <div class="smcs-category-item" data-category="Cleaning Needs" id="cleaning">
                            <i class="fas fa-soap"></i> Cleaning Needs</div>
                        <div class="smcs-category-item" data-category="Personal Care" id="personal_care">
                            <i class="fas fa-hand-holding-water"></i> Personal Care</div>
                        <div class="smcs-category-item" data-category="Health Care" id="health_care">
                            <i class="fas fa-heartbeat"></i> Health Care</div>
                        <div class="smcs-category-item" data-category="Crockeries" id="crockeries">
                            <i class="fas fa-utensils"></i> Crockeries</div>
                    </div>
                </div>

                <!-- Product Display Section -->
                <div class="col-md-9">
                    <h4 id="category-title" class="text-success">Select a Category</h4>
                    <div class="row me-2 product-container" id="product-list">
                        <!-- Products will be dynamically added here -->
                    </div>
                </div>

                <!--cart item-->
                <div id="cartSection" class="card shadow-sm p-3 mb-3" style="display: none;">
                    <h5 class="card-title">Your Cart</h5>
                    <div id="cartContainer"></div>
                    <button class="btn btn-success w-100 mt-2" onclick="window.location='cart.html'">Go to Cart</button> //move to js 
                </div>
            </div>
        </div>
    </div>

    <div class="all-template"></div>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../Public/Assests/Js/dashboard.js"></script>
    <script src="../../Public/Assests/Js/categories.js"></script>
    
    <script>
        $('.all-template').load('customelement.html', function () {
            let script = document.createElement('script');
            script.src = '../../Public/Assests/js/navigation.js';
            document.body.appendChild(script);
            
            let scriptTopNavigation = document.createElement('script');
            scriptTopNavigation.src = '../../Public/Assests/Js/top.navigation.js';
            document.body.appendChild(scriptTopNavigation);

            let scriptCustomerCategoriesList = document.createElement('script');
            scriptCustomerCategoriesList.src='../../Public/Assests/Js/categories.customer.js';
            document.body.appendChild(scriptCustomerCategoriesList);
        });    
    </script>
</body>
</html>
