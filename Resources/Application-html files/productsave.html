<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product save</title>
    <link rel="stylesheet" href="../../Public/Assests/CSS files/productsave.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery, Validation & InputMask Plugins -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-lg p-4">
            <h3 class="text-center mb-4">Add New Product</h3>
            <form id="productForm">
                <div class="mb-3">
                    <label for="productName" class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="productName" required>
                </div>
    
                <div class="mb-3">
                    <label for="productPackQuantity" class="form-label">Pack Quantity</label>
                    <input type="number" class="form-control" id="productPackQuantity" required>
                </div>
    
                <div class="mb-3">
                    <label for="productCategory" class="form-label">Category</label>
                    <select class="form-select" id="productCategory">
                        <option value="Self care">Self care</option>
                        <option value="Dairy product">Dairy product</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Fruits">Fruit</option>
                        <option value="vegetables">vegetables</option>
                        <option value="Beverages">Beverages</option>
                        <option value="Personal Care">Personal Care</option>
                    </select>
                </div>
    
                <div class="mb-3">
                    <label for="productPrice" class="form-label">Price</label>
                    <input type="text" class="form-control" id="productPrice" required>
                </div>
    
                <div class="mb-3">
                    <label for="productStockQuantity" class="form-label">Stock Quantity</label>
                    <input type="number" class="form-control" id="productStockQuantity" required>
                </div>
    
                <div class="mb-3">
                    <label for="productEffectiveDate" class="form-label">Effective Date</label>
                    <input type="datetime-local" class="form-control" id="productEffectiveDate" required>
                </div>
    
                <div class="mb-3">
                    <label for="productLastEffectiveDate" class="form-label">Last Effective Date</label>
                    <input type="datetime-local" class="form-control" id="productLastEffectiveDate" required>
                </div>
                
                <button type="button" class="btn btn-success p-2 w-100">Save Product</button>
            </form>
    
            <div id="responseMessage" class="mt-3 text-center"></div>
        </div>
    </div>
    <script src="../../Public/Assests/Js files/productsave.js"></script>
</body>
</html>
