<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../Public/Assests/CSS/register-page.css">

    <!-- jQuery, Validation & InputMask Plugins -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.8/jquery.inputmask.min.js"></script>
</head>

<body>
    <div class="smrs-container mt-5">
        <div class="smrs-card shadow-lg p-4">
            <div class="smrs-logo-container">
                <img src="../../Public/Assests/Images/supermarket_logo.png" alt="Logo" class="logo">
            </div>
            <h2 class="text-center mb-4">Customer Registration</h2>

            <!-- Avatar -->
            <div class="text-center mb-4">
                <div class="smrs-avatar-container">
                    <img id="smrs_avatar_Preview" src="../../Public/Assests/Images/general user icon.jpg" alt="Avatar">
                </div>
            </div>

            <form id="smrs_customer_form" autocomplete="off">
                <div class="row g-3">
                    <!-- <supermarket-customer-information></supermarket-customer-information>  -->
                    <!---------------------------------------------------------------------->
                    <div class="row">
                        <div class="col-md-4">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" name="firstName" class="form-control"
                                placeholder="First Name">
                        </div>
                        <div class="col-md-4">
                            <label for="middleName" class="form-label">Middle Name</label>
                            <input type="text" id="middleName" name="middleName" class="form-control"
                                placeholder="Middle Name">
                        </div>
                        <div class="col-md-4">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" id="lastName" name="lastName" class="form-control"
                                placeholder="Last Name">
                        </div>
                    </div>
                    <!-- Additional Information Panel -->
                    <div class="panel mt-sm-3">
                        <a class="panel-header d-flex" data-bs-toggle="collapse" href="#additionalInfoPanel"
                            role="button" aria-expanded="false" aria-controls="additionalInfoPanel">
                            <span class="toggle-icon">+</span> Additional Information
                        </a>
                        <div id="additionalInfoPanel" class="collapse panel-content">
                            <div class="row">
                                <div class="col-md-6">
                                    <label for="customer_email" class="form-label">Email</label>
                                    <input type="text" id="customer_email" name="customerEmail" class="form-control"
                                        placeholder="Email">
                                </div>
                                <div class="col-md-6">
                                    <label for="customer_confirm_email" class="form-label">Confirm Email</label>
                                    <input type="text" id="customer_confirm_email" name="customerConfirmEmail"
                                        class="form-control" placeholder="Confirm Email">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <label for="customer_password" class="form-label">Password</label>
                                    <input type="text" id="customer_password" name="customerPassword"
                                        class="form-control" placeholder="Password">
                                </div>
                                <div class="col-md-6">
                                    <label for="customer_confirm_password" class="form-label">Confirm Password</label>
                                    <input type="text" id="customer_confirm_password" name="customerConfirmPassword" class="form-control" placeholder="Password">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <label for="mobileNo" class="form-label">Mobile Phone</label>
                                    <input type="text" id="mobileNo" name="customerMobileNo" class="form-control"
                                        placeholder="Mobile Phone">
                                </div>
                            </div>
                        </div>
                    </div>
                
                    <!-- customer Address Panel -->
                    <div class="panel mt-2">
                        <a class="panel-header d-flex" data-bs-toggle="collapse" href="#customerAddressPanel"
                            role="button" aria-expanded="false" aria-controls="customerAddressPanel">
                            <span class="toggle-icon">+</span> Customer Address
                        </a>
                        <div id="customerAddressPanel" class="collapse panel-content">
                            <div class="row">
                                <div class="col-md-4">
                                    <label for="address_line_one" class="form-label">Address Line One</label>
                                    <input type="text" id="address_line_one" name="customerAddressLineOne" class="form-control mb-2"
                                        placeholder="Address Line One">
                                </div>
                                <div class="col-md-4">
                                    <label for="address_line_two" class="form-label">Address Line Two</label>
                                    <input type="text" id="address_line_two" name="customerAddressLineTwo" class="form-control mb-2"
                                        placeholder="Address Line Two">
                                </div>
                                <div class="col-md-4">
                                    <label for="city" class="form-label">City</label>
                                    <input type="text" id="city" name="customerCity" class="form-control mb-2"
                                        placeholder="City">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4">
                                    <label for="state" class="form-label " name="customerState">State</label>
                                    <select id="state" class="form-control form-select mb-2">
                                        <option value="">State</option>
                                        <option value="AL">Alabama</option>
                                        <option value="AK">Alaska</option>
                                        <option value="AS">American Samoa</option>
                                        <option value="AZ">Arizona</option>
                                        <option value="AR">Arkansas</option>
                                        <option value="CA">California</option>
                                        <option value="CO">Colorado</option>
                                        <option value="CT">Connecticut</option>
                                        <option value="DE">Delaware</option>
                                        <option value="DC">District of Columbia </option>
                                        <option value="FM">Federated States of Micronesia</option>
                                        <option value="FL">Florida</option>
                                        <option value="GA">Georgia</option>
                                        <option value="GU">Guam</option>
                                        <option value="HI">Hawaii</option>
                                        <option value="ID">Idaho</option>
                                        <option value="IL">Illinois</option>
                                        <option value="IN">Indiana</option>
                                        <option value="IA">Iowa</option>
                                        <option value="KS">Kansas</option>
                                        <option value="KY">Kentucky</option>
                                        <option value="LA">Louisiana</option>
                                        <option value="ME">Maine</option>
                                        <option value="MH">Marshall Islands</option>
                                        <option value="MD">Maryland</option>
                                        <option value="MA">Massachusetts</option>
                                        <option value="MI">Michigan</option>
                                        <option value="MN">Minnesota</option>
                                        <option value="MS">Mississippi</option>
                                        <option value="MO">Missouri</option>
                                        <option value="MT">Montana</option>
                                        <option value="NE">Nebraska</option>
                                        <option value="NV">Nevada</option>
                                        <option value="NH">New Hampshire</option>
                                        <option value="NJ">New Jersey</option>
                                        <option value="NM">New Mexico</option>
                                        <option value="NY">New York</option>
                                        <option value="NC">North Carolina</option>
                                        <option value="ND">North Dakota</option>
                                        <option value="MP">Northern Mariana Islands</option>
                                        <option value="OH">Ohio</option>
                                        <option value="OK">Oklahoma</option>
                                        <option value="OR">Oregon</option>
                                        <option value="PW">Palau</option>
                                        <option value="PA">Pennsylvania</option>
                                        <option value="PR">Puerto Rico</option>
                                        <option value="RI">Rhode Island</option>
                                        <option value="SC">South Carolina</option>
                                        <option value="SD">South Dakota</option>
                                        <option value="TN">Tennessee</option>
                                        <option value="TX">Texas</option>
                                        <option value="UT">Utah</option>
                                        <option value="VT">Vermont</option>
                                        <option value="VA">Virginia</option>
                                        <option value="VI">Virgin Islands</option>
                                        <option value="WA">Washington</option>
                                        <option value="WV">West Virginia</option>
                                        <option value="WI">Wisconsin</option>
                                        <option value="WY">Wyoming</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="zipcode" class="form-label">ZipCode</label>
                                    <input type="text" class="form-control mb-2" placeholder="ZipCode" id="zipcode" name="customerPincode">
                                </div>
                                <div class="col-md-4">
                                    <label for="country" class="form-label">Country</label>
                                    <input type="text" id="country" name="customerCountry" class="form-control mb-2" value="USA" disabled>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                    <!---------------------------------------------------------------------->
                    
                <div class="mt-4 text-center">
                    <button type="button" class="btn btn-success w-25" id="smrs_register_btn">Register</button>
                    <button type="button" class="btn btn-outline-secondary w-25" id="smrs_reset_btn">Reset</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Message -->
    <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1050">
        <!-- remove border -->
        <div id="liveToast" class="toast border-0">
            <div class="d-flex">
                <div class="toast-body fw-bold text-danger text-center" id="toastBody">
                    <!-- Message will be inserted dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="resetConfirmationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmation Alert</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <p>Are you sure about clearing the data?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="confirmReset">Yes</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                </div>
            </div>
        </div>
    </div>

    <div class="all-template"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../Public/Assests/Js/register.page.js"></script>
    <script>
        $('.all-template').load('customelement.html', function () {
            let scriptCustomerInformation = document.createElement('script');
            scriptCustomerInformation.src = '../../Public/Assests/Js/customer.information.js';
            document.body.appendChild(scriptCustomerInformation);
        });
    </script>
</body>
</html>
