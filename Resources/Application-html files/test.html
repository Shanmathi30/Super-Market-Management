

<script>
    $(document).ready(function () {
        // Load product details into the form when the modal is opened
        $('#sm_product_update_modal_id').on('show.bs.modal', function (event) {
            let button = $(event.relatedTarget);
            let productId = button.data('product-id');
            loadProductDetails(productId);
        });

        // Update product details when the update button is clicked
        $('#sm_product_details_update').click(function () {
            updateProduct();
        });
    });

    function loadProductDetails(productId) {
        $.ajax({
            url: `/products/view/${productId}`,
            type: "GET",
            success: function (response) {
                let product = response.data;
                $("#update_product_id").val(product.productId);
                $("#update_product_name").val(product.productName);
                $("#update_product_pack_quantity").val(product.productPackQuantity);
                $("#update_product_category").val(product.productCategory);
                $("#update_product_price").val(product.productPrice);
                $("#update_product_stock_quantity").val(product.productStockQuantity);
                
                // Convert date format to match input[type="datetime-local"]
                let effectiveDate = formatDateForInput(product.productEffectiveDate);
                let lastEffectiveDate = formatDateForInput(product.productLastEffectiveDate);
                
                $("#update_product_effective_date").val(effectiveDate);
                $("#update_product_last_effective_date").val(lastEffectiveDate);
            }
        });
    }

    function updateProduct() {
        let productData = {
            productId: $("#update_product_id").val(),
            productName: $("#update_product_name").val(),
            productPackQuantity: $("#update_product_pack_quantity").val(),
            productCategory: $("#update_product_category").val(),
            productPrice: $("#update_product_price").val(),
            productStockQuantity: $("#update_product_stock_quantity").val(),
            productEffectiveDate: formatInputForAPI($("#update_product_effective_date").val()),
            productLastEffectiveDate: formatInputForAPI($("#update_product_last_effective_date").val())
        };

        $.ajax({
            url: "/products/saveOrUpdate",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(productData),
            success: function (response) {
                $("#updateProductMessage").text(response.message).show();
                setTimeout(() => {
                    $("#updateProductMessage").hide();
                    $('#sm_product_update_modal_id').modal('hide');
                    location.reload();
                }, 1500);
            }
        });
    }

    function formatDateForInput(apiDate) {
        if (!apiDate) return "";
        let [date, time] = apiDate.split(" ");
        let [month, day, year] = date.split("-");
        let formattedDate = `${year}-${month}-${day}T${time}`;
        return formattedDate;
    }

    function formatInputForAPI(inputDate) {
        if (!inputDate) return "";
        let [date, time] = inputDate.split("T");
        let [year, month, day] = date.split("-");
        return `${month}-${day}-${year} ${time}`;
    }
</script>
