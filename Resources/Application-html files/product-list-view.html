<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product</title>
    <link rel="stylesheet" href="../../Public/Assests/CSS/dashboard.css">
    <!-- <link rel="stylesheet" href="../../Public/Assests/CSS/register-page.css"> -->
    <link rel="stylesheet" href="../../Public/Assests/CSS/product-list-view.css">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Tempus Dominus Bootstrap 5 CSS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@eonasdan/tempus-dominus@6.7.10/dist/css/tempus-dominus.min.css" />
    <style>
        .smls-list-container {
            width: 95%;
            margin: 35px;
        }
        body {
            background: url("../../Public/Assests/Images/add-product-background.jpg")no-repeat center center fixed;
            background-size: cover;
            margin: 30px;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="smds-sidebar">
        <supermarket-side-navigation></supermarket-side-navigation>
    </div>
    <div class="smds-content-wrapper">
        <!-- Navbar -->
        <nav class="navbar" style="width:96%;">
            <supermarket-top-navigation style="display:block; width:100%;"></supermarket-top-navigation>
        </nav>
        <!---main content-->
        <main class="smls-list-container">
            <div class="card p-3">
                <h3 class="text-center mb-4">Product List</h3>
                <form id="product_filter_id">
                    <div class="row">
                        <div class=" col-md-2 mb-3">
                            <label for="product_length">Show</label>
                            <select id="product_length" class="form-control">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <div class=" col-md-3 mb-3">
                            <label for="search_product">Search</label>
                            <input type="text" id="search_product" class="form-control" placeholder="Search by Name">
                        </div>
                        <div class="col-md-3">
                            <label for="search_product_city">product Category</label>
                            <input type="text" id="search_product_category" class="form-control"
                                placeholder="Search by Category">
                        </div>
                        <div class="col-md-3">
                            <button type="button" id="btn_reset"
                                class="btn btn-outline-secondary mt-md-4 me-2">Reset</button>
                            <button type="button" id="btn_submit" class="btn btn-success mt-md-4">Submit</button>
                        </div>
                    </div>
                </form>
                <table id="product_list_table" class="table table-bordered table- table-hover">
                    <thead class="table">
                        <tr>
                            <th>s.no</th>
                            <th>Name</th>
                            <th>Pack Quantity</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock Quantity</th>
                            <th>Effective Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- products will be appended here -->
                    </tbody>
                </table>
            </div>
        </main>
        <div class="modal fade pt-lg-5" id="sm_product_view_modal_id" tabindex="-1" aria-labelledby="resetModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header text-center w-100">
                        <h5 class="modal-title w-100" id="resetModalLabel">View Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center">
                        <h4>Product Details</h4>
                        <p><strong>Product Name:</strong> <span id="view_product_name"></span></p>
                        <p><strong>Product Pack Quantity:</strong> <span id="view_product_pack_quantity"></span></p>
                        <p><strong>Product Category:</strong> <span id="view_product_category"></span></p>
                        <p><strong>Product Price:</strong> <span id="view_product_price"></span></p>
                        <p><strong>Product Stock Quantity:</strong> <span id="view_product_stock_quantity"></span></p>
                        <p><strong>product Effective Date</strong> <span id="view_product_effective_date"></span></p>
                    </div>
                </div>
            </div>
        </div>
        <!--add product-->
        <div class="modal fade pt-lg-5" id="sm_product_add_modal_id" tabindex="-1" aria-labelledby="resetModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header text-center w-100">
                        <h5 class="modal-title w-100" id="resetModalLabel">Add Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center">
                        <h4>Product Details</h4>
                        <form id="sm_product_update_form" autocomplete="off">
                            <div class="row g-3">
                                <div class="col-md-6 mb-3">
                                    <label for="product_name" class="form-label">Product Name</label>
                                    <input type="text" class="form-control" id="product_name" name="productName">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="product_pack_quantity" class="form-label">Pack Quantity</label>
                                    <input type="number" class="form-control" id="product_pack_quantity"
                                        name="productPackQuantity">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="product_category" class="form-label">Category</label>
                                    <select class="form-select" id="product_category" name="productCategory">
                                        <option value="" disabled selected>-- Select a Category --</option>
                                        <option value="Fruits And Vegetables">Fruits And Vegetables</option>
                                        <option value="Staples">Staples</option>
                                        <option value="Snacks And Namkeens">Snacks And Namkeens</option>
                                        <option value="Beverages">Beverages</option>
                                        <option value="Chilled And Dairy Foods">Chilled And Dairy Foods</option>
                                        <option value="Ready To Cook">Ready To Cook</option>
                                        <option value="Ready To Eat">Ready To Eat</option>
                                        <option value="Baby Care">Baby Care</option>
                                        <option value="Household">Household</option>
                                        <option value="Feminine Care">Feminine Care</option>
                                        <option value="Cleaning Needs">Cleaning Needs</option>
                                        <option value="Personal Care">Personal Care</option>
                                        <option value="Health Care">Health Care</option>
                                        <option value="Crockeries">Crockeries</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="" class="form-label">Price</label>
                                    <input type="text" class="form-control" id="product_price" name="productPrice">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="product_stock_quantity" class="form-label">Stock Quantity</label>
                                    <input type="number" class="form-control" id="product_stock_quantity"
                                        name="productStockQuantity">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="product_effective_date" class="form-label">Effective Date</label>
                                    <div class="input-group" id="effectiveDatePicker">
                                        <input type="text" class="form-control" id="product_effective_date"
                                            name="productEffectiveDate">
                                        <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="product_last_effective_date" class="form-label">Last Effective
                                        Date</label>
                                    <div class="input-group" id="lastEffectiveDatePicker">
                                        <input type="text" class="form-control" id="product_last_effective_date"
                                            name="productLastEffectiveDate">
                                        <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                                    </div>
                                </div>
                            </div>
                            <div class="row smp-product-details-update-buttons-section mt-3">
                                <div class="col-12 d-flex justify-content-center gap-3">
                                    <button type="button" class="btn btn-success px-4 py-2"
                                        id="sm_product_details_update">Update</button>
                                    <button type="button" class="btn btn-outline-secondary px-4 py-2"
                                        data-bs-dismiss="modal">Cancel</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="all-template"></div>
    <script src="../../Public/Assests/Js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../Public/Assests/Js/product.list.view.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Moment.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>

    <!-- Tempus Dominus Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/@eonasdan/tempus-dominus@6.7.10/dist/js/tempus-dominus.min.js"></script>
    <script>
        $('.all-template').load('customelement.html', function () {
            let script = document.createElement('script');
            script.src = '../../Public/Assests/js/navigation.js';
            document.body.appendChild(script);

            let scriptTopNavigation = document.createElement('script');
            scriptTopNavigation.src = '../../Public/Assests/Js/top.navigation.js';
            document.body.appendChild(scriptTopNavigation);
        });  
    </script>
    <script>
        $(document).ready(function () {
            new tempusDominus.TempusDominus(document.getElementById("effectiveDatePicker"), {
                display: {
                    format: "MM-DD-YYYY hh:mm a"
                }
            });

            new tempusDominus.TempusDominus(document.getElementById("lastEffectiveDatePicker"), {
                display: {
                    format: "MM-DD-YYYY hh:mm a"
                }
            });
        });
    </script>
</body>
</html>
