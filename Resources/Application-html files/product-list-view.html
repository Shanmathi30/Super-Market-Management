<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../Public/Assests/CSS/dashboard.css">
    <link rel="stylesheet" href="../../Public/Assests/CSS/product-list-view.css">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!--toastr.js-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

    <style>
        .smls-list-container {
            width: 95%;
            margin: 35px;
        }

        body {
            background: url("../../Public/Assests/Images/add-product-background.jpg")no-repeat center center fixed;
            background-size: cover;
            margin: 30px;
        }
    </style> 
</head>
<body>
    <!-- Sidebar -->
    <div class="smds-sidebar">
        <supermarket-side-navigation></supermarket-side-navigation>
    </div>
    <div class="smds-content-wrapper">
        <!-- Navbar -->
        <nav class="navbar" style="width:96%;">
            <supermarket-top-navigation style="display:block; width:100%;"></supermarket-top-navigation>
        </nav>
        <!---main content-->
        <main class="smls-list-container">
            <!---input field-->
            <div class="card p-3">
                <h3 class="text-lg-start mb-4">Product List</h3>
                <form id="product_filter_id">
                    <div class="row">
                        <div class="col-md-2 mb-3">
                            <label for="product_length">Show</label>
                            <select id="product_length" class="form-control form-select">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="search_product">Search</label>
                            <input type="text" id="search_product" class="form-control" placeholder="Search by Name">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="search_product_category">Product Category</label>
                            <input type="text" id="search_product_category" class="form-control"
                                placeholder="Search by Category">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Product Status</label>
                            <div class="d-flex">
                                <div class="form-check me-3">
                                    <input class="form-check-input" type="radio" name="product_status" id="status_all"
                                        value="all" checked>
                                    <label class="form-check-label" for="status_all">All</label>
                                </div>
                                <div class="form-check me-3">
                                    <input class="form-check-input" type="radio" name="product_status"
                                        id="status_active" value="active">
                                    <label class="form-check-label" for="status_active">Active</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="product_status"
                                        id="status_deactive" value="deactive">
                                    <label class="form-check-label" for="status_deactive">Deactive</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- New Row for Buttons -->
                    <div class="row mt-3">
                        <div class="col-12 d-flex justify-content-end">
                            <button type="button" id="btn_reset" class="btn btn-outline-secondary me-2">Reset</button>
                            <button type="button" id="btn_submit" class="btn btn-success">Submit</button>
                        </div>
                    </div>
                </form>

                <table id="product_list_table" class="table table-bordered table-hover mt-3">
                    <thead class="table">
                        <tr>
                            <th>S.No</th>
                            <th>Name</th>
                            <!-- <th>Pack Quantity</th> -->
                            <th>Category</th>
                            <!-- <th>Price</th> -->
                            <!-- <th>Stock Quantity</th> -->
                            <th>Effective Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- Products will be appended here -->
                    </tbody>
                </table>
            </div>
        </main>
        <!--add product-->      
<div class="modal fade pt-lg-5" id="sm_product_add_modal_id" tabindex="-1" aria-labelledby="resetModalLabel"
aria-hidden="true">
<div class="modal-dialog modal-xl">
    <div class="modal-content">
        <div class="modal-header text-center w-100">
            <h5 class="modal-title w-100" id="resetModalLabel">Add Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
            <form id="sm_product_form" autocomplete="off">
                <div class="row g-3">
                    <div class="col-md-6 mb-3">
                        <label for="product_name" class="form-label">Product Name</label>
                        <input type="text" class="form-control" id="product_name" name="productName" placeholder="Product Name">
                        <span class="error-message"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="product_pack_quantity" class="form-label">Pack Quantity</label>
                        <input type="number" class="form-control" id="product_pack_quantity"
                        name="productPackQuantity" placeholder="Product Pack Quantity">
                            <span class="error-message"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="product_category" class="form-label">Category</label>
                        <select class="form-control form-select" id="product_category" name="productCategory" placeholder="Select Category">
                            <option value="">-- Select a Category --</option>
                            <option value="Fruits And Vegetables">Fruits And Vegetables</option>
                            <option value="Staples">Staples</option>
                            <option value="Snacks And Namkeens">Snacks And Namkeens</option>
                            <option value="Beverages">Beverages</option>
                            <option value="Chilled And Dairy Foods">Chilled And Dairy Foods</option>
                            <option value="Ready To Cook">Ready To Cook</option>
                            <option value="Ready To Eat">Ready To Eat</option>
                            <option value="Baby Care">Baby Care</option>
                            <option value="Household">Household</option>
                            <option value="Feminine Care">Feminine Care</option>
                            <option value="Cleaning Needs">Cleaning Needs</option>
                            <option value="Personal Care">Personal Care</option>
                            <option value="Health Care">Health Care</option>
                            <option value="Crockeries">Crockeries</option>
                        </select>
                        <span class="error-message"></span>
                    </div>
                    <!-- Price Field with Dollar Symbol -->
                    <div class="col-md-6 mb-3">
                        <label for="product_price" class="form-label">Price</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="text" class="form-control" id="product_price" name="productPrice" placeholder="Product Price">
                        </div>
                        <span class="error-message"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="product_stock_quantity" class="form-label">Stock Quantity</label>
                        <input type="number" class="form-control" id="product_stock_quantity"
                            name="productStockQuantity" placeholder="Product Stock Quantity">
                        <span class="error-message"></span>
                    </div>
                    <!-- Effective Date with Clock Icon -->
                    <div class="col-md-6 mb-3">
                        <label for="product_effective_date" class="form-label">Effective Date</label>
                        <div class="input-group">
                            <input type="text" class="form-control datetimepicker" id="product_effective_date"
                                name="productEffectiveDate" placeholder="Product Effective Date">
                            <span class="input-group-text"><i class="fa-solid fa-calendar-days"></i></span>
                        </div>
                        <span class="error-message"></span>
                    </div>
                    <!-- Last Effective Date with Clock Icon -->
                    <div class="col-md-6 mb-3">
                        <label for="product_last_effective_date" class="form-label">Last Effective Date</label>
                        <div class="input-group">
                            <input type="text" class="form-control datetimepicker" id="product_last_effective_date" name="productLastEffectiveDate" placeholder="Product Last Effective Date">
                            <span class="input-group-text"><i class="fa-solid fa-calendar-days"></i></span>
                        </div>
                        <span class="error-message"></span>
                    </div>
                </div>
                <div class="mt-4 text-lg-end">
                    <button type="button" class="btn btn-success w-25" id="smrs_add_product_btn">Add Product</button>
                    <button type="button" class="btn btn-outline-danger w-25" id="smrs_cancel_btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
        <!-- Edit Product Modal -->
        <div class="modal fade pt-lg-5" id="sm_product_update_modal_id" tabindex="-1" aria-labelledby="productUpdateModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header text-center w-100">
                <h5 class="modal-title w-100" id="productUpdateModalLabel">Update Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <form id="sm_product_update_form">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="update_product_name" class="form-label">Product Name</label>
                                <input type="text" id="update_product_name" name="update_product_name"
                                    class="form-control">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="update_product_pack_quantity" class="form-label">Pack Quantity</label>
                                <input type="text" id="update_product_pack_quantity" name="update_product_pack_quantity"
                                    class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="update_product_price" class="form-label">Price</label>
                                <input type="number" id="update_product_price" name="update_product_price"
                                    class="form-control">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="update_product_stock_quantity" class="form-label">Stock Quantity</label>
                                <input type="number" id="update_product_stock_quantity"
                                    name="update_product_stock_quantity" class="form-control datetimepicker">
                            </div>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="update_product_effective_date" class="form-label">Effective Date</label>
                                <input type="text" id="update_product_effective_date"
                                    name="update_product_effective_date" class="form-control datetimepicker">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="update_product_last_effective_date" class="form-label">Last Effective Date</label>
                                <input type="text" id="update_product_last_effective_date"
                                    name="update_product_last_effective_date" class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12 d-flex justify-content-center gap-3">
                            <button type="button" class="btn btn-success px-4 py-2" id="sm_product_details_update">Update</button>
                            <button type="button" class="btn btn-outline-secondary px-4 py-2" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </div>
                    <!-- Message Display -->
                    <p id="updateProductMessage" class="text-center mt-2 fw-bold" style="display: none;"></p>
                </form>
            </div>
        </div>
    </div>
        </div>
        <!--view product-->
        <div class="modal fade" id="sm_product_view_modal_id" tabindex="-1" aria-labelledby="productViewModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header text-center w-100">
                        <h5 class="modal-title w-100" id="productViewModalLabel">View Product Details</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center">
                        <p><strong>Product Name:</strong> <span id="view_product_name"></span></p>
                        <p><strong>Category:</strong> <span id="view_product_category"></span></p>
                        <p><strong>Price:</strong> <span id="view_product_price"></span></p>
                        <p><strong>Stock Quantity:</strong> <span id="view_product_stock"></span></p>
                        <p><strong>Pack Quantity:</strong> <span id="view_product_pack_quantity"></span></p>
                        <p><strong>Effective Date:</strong> <span id="view_product_effective_date"></span></p>
                        <p><strong>Last Effective Date:</strong> <span id="view_product_last _effective_date"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="all-template"></div>
    <!-- Load external scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.14.0/jquery.timepicker.min.js"></script>
    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.full.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <!-- Custom Scripts -->
    <script src="../../Public/Assests/Js/dashboard.js"></script>

    <script>
        $('.all-template').load('customelement.html', function () {
            let script = document.createElement('script');
            script.src = '../../Public/Assests/js/navigation.js';
            document.body.appendChild(script);

            let scriptTopNavigation = document.createElement('script');
            scriptTopNavigation.src = '../../Public/Assests/Js/top.navigation.js';
            document.body.appendChild(scriptTopNavigation);

            let scriptProductListView=document.createElement('script');
            scriptProductListView.src = '../../Public/Assests/Js/product.list.view.js';
            document.body.appendChild(scriptProductListView);
        });  
    </script>
</body>
</html>
