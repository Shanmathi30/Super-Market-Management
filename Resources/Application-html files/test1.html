<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category & Products</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"> 
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background-color: #ecf8ec;
            font-family: 'Arial', sans-serif;
        }
        /* Category Section */
        .category-list {
            background: linear-gradient(to right, #a7dca7, #4caf50);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.2);
        }
        .category-item {
            cursor: pointer;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            background: white;
            transition: all 0.3s ease-in-out;
            font-weight: bold;
            color: #2d572c;
        }
        .category-item i {
            margin-right: 12px;
            font-size: 22px;
            color: #1a471a;
        }
        .category-item:hover {
            background: #81c784;
            transform: scale(1.05);
            color: white;
        }
        .category-item.active {
            background: #2e7d32;
            color: white;
            box-shadow: 0 0 10px rgba(46, 125, 50, 0.8);
        }
        .category-item:hover i,
        .category-item.active i {
            color:white !important;
        }
        /* Product Section */
        .product-card {
            border: none;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            background: white;
            box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .discount-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: red;
            color: white;
            padding: 5px;
            font-size: 12px;
            border-radius: 5px;
        }
        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .product-icon {
            font-size: 50px;
            color: #388e3c;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="row">
        <!-- Category Section -->
        <div class="col-md-3">
            <h4 class="text-success">Categories</h4>
            <div class="category-list">
                <div class="category-item" data-category="fruits"><i class="fas fa-apple-alt"></i> Fruits & Vegetables</div>
                <div class="category-item" data-category="staples"><i class="fas fa-utensils"></i> Staples</div>
                <div class="category-item" data-category="snacks"><i class="fas fa-cookie"></i> Snacks & Namkeens</div>
                <div class="category-item" data-category="beverages"><i class="fas fa-coffee"></i> Beverages</div>
                <div class="category-item" data-category="dairy"><i class="fas fa-cheese"></i> Chilled & Dairy Foods</div>
                <div class="category-item" data-category="readycook"><i class="fas fa-fire"></i> Ready To Cook</div>
                <div class="category-item" data-category="ready-eat"><i class="fas fa-utensil-spoon"></i> Ready To Eat</div>
                <div class="category-item" data-category="baby-care"><i class="fas fa-baby"></i> Baby Care</div>
                <div class="category-item" data-category="household"><i class="fas fa-home"></i> Household</div>
                <div class="category-item" data-category="feminine-care"><i class="fas fa-female"></i> Feminine Care</div>
                <div class="category-item" data-category="cleaning"><i class="fas fa-soap"></i> Cleaning Needs</div>
                <div class="category-item" data-category="personal-care"><i class="fas fa-hand-holding-water"></i> Personal Care</div>
                <div class="category-item" data-category="health-care"><i class="fas fa-heartbeat"></i> Health Care</div>
                <div class="category-item" data-category="crockeries"><i class="fas fa-utensils"></i> Crockeries</div>
            </div>
        </div>

        <!-- Product Display Section -->
        <div class="col-md-9">
            <h4 id="category-title" class="text-success">Select a Category</h4>
            <div class="row product-container" id="product-list">
                <!-- Products will be dynamically added here -->

            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function(){
        // Category wise products (mock data)
        const products = {
            fruits: [
                { name: "Apple", price: 120, discount: 10, icon: "fas fa-apple-alt" },
                { name: "Banana", price: 60, discount: 15, icon: "fas fa-lemon" }
            ],
            staples: [
                { name: "Sugar", price: 50, discount: 10, icon: "fas fa-seedling" },
                { name: "Rice", price: 80, discount: 5, icon: "fas fa-bread-slice" }
            ],
            snacks: [
                { name: "Chips", price: 30, discount: 20, icon: "fas fa-cookie-bite" },
                { name: "Biscuits", price: 40, discount: 10, icon: "fas fa-cookie" }
            ],
            beverages: [
                { name: "Orange Juice", price: 90, discount: 12, icon: "fas fa-wine-glass" },
                { name: "Milkshake", price: 120, discount: 15, icon: "fas fa-mug-hot" }
            ],
            dairy: [
                { name: "Cheese", price: 250, discount: 8, icon: "fas fa-cheese" },
                { name: "Butter", price: 200, discount: 12, icon: "fas fa-ice-cream" }
            ],
            readycook: [
                { name: "Frozen Paratha", price: 50, discount: 5, icon: "fas fa-hotdog" },
                { name: "Instant Noodles", price: 30, discount: 10, icon: "fas fa-bowl-rice" }
            ],
            "ready-eat": [
                { name: "Pasta", price: 150, discount: 18, icon: "fas fa-pizza-slice" },
                { name: "Curry Pack", price: 100, discount: 12, icon: "fas fa-drumstick-bite" }
            ],
            "baby-care": [
                { name: "Baby Wipes", price: 150, discount: 10, icon: "fas fa-baby" },
                { name: "Baby Lotion", price: 250, discount: 15, icon: "fas fa-pump-medical" }
            ],
            household: [
                { name: "Laundry Detergent", price: 200, discount: 5, icon: "fas fa-tshirt" },
                { name: "Air Freshener", price: 120, discount: 8, icon: "fas fa-spray-can" }
            ],
            "feminine-care": [
                { name: "Sanitary Napkins", price: 90, discount: 12, icon: "fas fa-venus" },
                { name: "Feminine Wash", price: 180, discount: 10, icon: "fas fa-bath" }
            ],
            cleaning: [
                { name: "Toilet Cleaner", price: 140, discount: 12, icon: "fas fa-pump-soap" },
                { name: "Floor Cleaner", price: 170, discount: 10, icon: "fas fa-broom" }
            ],
            "personal-care": [
                { name: "Shampoo", price: 250, discount: 15, icon: "fas fa-bath" },
                { name: "Face Wash", price: 150, discount: 10, icon: "fas fa-smile" }
            ],
            "health-care": [
                { name: "Vitamin Tablets", price: 300, discount: 20, icon: "fas fa-pills" },
                { name: "First Aid Kit", price: 500, discount: 10, icon: "fas fa-briefcase-medical" }
            ],
            crockeries: [
                { name: "Dinner Set", price: 800, discount: 18, icon: "fas fa-utensils" },
                { name: "Tea Cups", price: 250, discount: 12, icon: "fas fa-coffee" }
            ]
        };

        // Handle category click event
        $(".category-item").click(function(){
            let category = $(this).data("category");
            let categoryTitle = $(this).text();
            
            // Remove active class from all categories and add to clicked one
            $(".category-item").removeClass("active");
            $(this).addClass("active");

            $("#category-title").text(categoryTitle);
            // $("#product-list").html(""); // Clear previous products
            
            // products[category]?.forEach(product => {
            //     let discountPrice = product.price - (product.price * product.discount / 100);
                
            //     let productHTML = `
            //         <div class="col-md-4">
            //             <div class="product-card position-relative">
            //                 <span class="discount-badge">${product.discount}% OFF</span>
            //                 <i class="${product.icon} product-icon"></i>
            //                 <h5>${product.name}</h5>
            //                 <p><s>₹${product.price}</s> <b style="color:red;">₹${discountPrice.toFixed(0)}</b></p>
            //             </div>
            //         </div>
            //     `;
            //     $("#product-list").append(productHTML);
            // });

            $("#product-list").html(products[category]?products[category].reduce((prevElement,currenElement) => {
                let discountPrice = currenElement.price - (currenElement.price * currenElement.discount / 100);
                return `${prevElement} <div class="col-md-4">
                        <div class="product-card position-relative">
                            <span class="discount-badge">${currenElement.discount}% OFF</span>
                            <i class="${currenElement.icon} product-icon"></i>
                            <h5>${currenElement.name}</h5>
                            <p><s>₹${currenElement.price}</s> <b style="color:red;">₹${discountPrice.toFixed(0)}</b></p>
                        </div>
                    </div>`
            },"") :"")
        });
    });
</script>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
