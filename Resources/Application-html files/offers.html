    <!-- jQuery, Validation & InputMask Plugins -->

    <style>
        /*** Banner section ***/
        .smps-banners {
            display: flex;
            width: 100%;
            height: 400px;
            gap: 10px;
            margin-top: 80px;
        }
        .smps-banner-fruitJuice, .smps-banner-fruitPop {
            width: 100%;
            background-repeat: no-repeat;
            background-size: cover;
            border-radius: 10px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .smps-banner-fruitJuice {
            background-image: url("../../Public/Assests/Images/juice.jpg");
        }
        .smps-banner-fruitPop {
            background-image: url("../../Public/Assests/Images/kiwi.jpg");
        }
        .banner-inner {
            margin-left: 20px;
            padding: 20px;
            width: 250px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
        }
        .subtitle {
            font-size: 24px;
            margin: 0 0 10px;
            color: #227c47;
        }
        .title {
            font-size: 30px;
            font-weight: 600;
            margin: 0 0 15px;
        }
        .btn-12 {
            display: inline-block;
            padding: 10px 25px;
            font-weight: 500;
            background: white;
            border-radius: 5px;
            text-decoration: none;
            color: black;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .btn-12:after {
            content: "";
            position: absolute;
            width: 100%;
            height: 0;
            bottom: 0;
            left: 0;
            z-index: -1;
            background: orange;
            transition: all 0.3s ease;
            border-radius: 5px;
        }
        .btn-12:hover {
            color: #fff;
        }
        .btn-12:hover:after {
            height: 100%;
        }
        .shine-overlay {
            position: relative;
            overflow: hidden;
        }
        .shine {
            display: none;
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.5) 0, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 100%);
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            transform: skew(30deg);
            animation: shine 0.75s linear 1;
        }
        @keyframes shine {
            0% { left: -50%; opacity: 0; }
            50% { left: 25%; opacity: 0.5; }
            100% { left: 100%; opacity: 0; }
        }
        .shine-overlay:hover .shine {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="smds-sidebar">
        <supermarket-side-navigation></supermarket-side-navigation>
    </div>

    <!-- Navbar -->
    <div class="smds-content-wrapper">
        <nav class="navbar" style="width:96%;">
            <supermarket-top-navigation style="display:block; width:100%;"></supermarket-top-navigation>
        </nav>
    <div class="smps-banners">
        <div class="smps-banner-fruitJuice shine-overlay">
            <div class="banner-inner">
                <div class="subtitle">Save 45% OFF</div>
                <div class="title">Fresh &amp; Tasty <br> Fruits Juice</div>
                <a class="btn btn-12" href="product-dashboard.html">Shop Now</a>
            </div>
            <div class="shine"></div>
        </div>
        <div class="smps-banner-fruitPop shine-overlay">
            <div class="banner-inner">
                <div class="subtitle">Save 45% OFF</div>
                <div class="title">Fresh &amp; Tasty <br> Fruits Ice Pop</div>
                <a class="btn btn-12" href="product-dashboard.html">Shop Now</a>
            </div>
            <div class="shine"></div>
        </div>
    </div>
    </div>

    <script src="../../Public/Assests/Js/dashboard.js"></script>

        $('.all-template').load('customelement.html', function () {
            let script = document.createElement('script');
            script.src = '../../Public/Assests/js/navigation.js';
            document.body.appendChild(script);

            let scriptTopNavigation = document.createElement('script');
            scriptTopNavigation.src = '../../Public/Assests/Js/top.navigation.js';

</body>
