<!---top navigation template-->
<template id="sm_supermarket_top_navigation_template">
    <div class="container-fluid p-0 d-flex justify-content-between">
        <!-- Logo -->
        <a class="navbar-brand text-white d-flex align-items-center" href="#">
            <img src="../../Public/Assests/Images/supermarket logo.jpg" alt="logo" class="logo-image">
            <span class="brand-text">FOOD<span class="orange-text">HUB</span></span>
        </a>
        <!-- Search Bar -->
        <div class="search-bar">
            <input class="form-control" type="search" placeholder="Search for vegetables, fruits....." aria-label="Search">
            <i class='fas fa-search search-icon'></i>
        </div>
        <!-- Cart & Avatar -->
        <div class="d-flex align-items-center ms-3 me-4">
            <!-- Cart Icon with Badge -->
            <div class="cart-container">
                <i class="fa-solid fa-cart-shopping text-white fs-4"></i>
                <span class="position-absolute cart-badge badge bg-danger rounded-pill">0</span>
            </div>
            <!-- Avatar Icon -->
            <div class="avatar-icon  top-0 right-0 ms-3" id="avatarIcon">
                <i class="fa-solid fa-user text-dark fs-5"></i>
            </div>
            <!-- Profile Card (Initially Hidden) -->
            <div id="profileCard">
                <div class="profile-card-content">
                    <img src="../../Public/Assests/Images/general user icon.jpg" class="profile-pic" alt="User Avatar">
                    <h5 class="user-name"></h5>
                    <button id="logout_button" class="btn btn-logout mt-2">Logout</button>                        
               </div>
            </div>
        </div>
    </div>
</template>

<!--- cuastomer register and update form template-->
<template id="sm_supermarket_customer_information_template">
    <div class="row">
        <div class="col-md-4">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" id="firstName" name="firstName" class="form-control">
        </div>
        <div class="col-md-4">
            <label for="middleName" class="form-label">Middle Name</label>
            <input type="text" id="middleName" name="middleName" class="form-control">
        </div>
        <div class="col-md-4">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" id="lastName" name="lastName" class="form-control">
        </div>
        <div class="col-md-4">
            <label for="mobileNo" class="form-label">Mobile Number</label>
            <input type="text" id="mobileNo" name="mobileNo" class="form-control">
        </div>
        <div class="col-md-4">
            <label for="customer_email" class="form-label">Email</label>
            <input type="text" id="customer_email" name="customer_email" class="form-control">
        </div>
        <div class="col-md-4">
            <label for="customer_password" class="form-label">Password</label>
            <input type="text" id="customer_password" name="customer_password" class="form-control">
        </div>
        <div class="col-md-12">
            <label for="address" class="form-label">Address</label>
            <input type="text" id="address" name="address" class="form-control">
        </div>
        <div class="col-md-4">
            <label for="location" class="form-label">Location</label>
            <input type="text" id="location" name="location" class="form-control">
        </div>
        <div class="col-md-4">
            <label for="city" class="form-label">City</label>
            <input type="text" id="city" name="city" class="form-control">
        </div>
        <div class="col-md-4">
            <label for="pincode" class="form-label">Pincode</label>
            <input type="text" id="pincode" name="pincode" class="form-control">
        </div>
    </div>
</template>

<!--product categories list view for customer-->
<template id="sm_supermarket_product_information_template">
    <div class="row mr-3">
        <!-- Category Section -->
        <div class="col-md-3">
            <h4 class="text-success">Categories</h4>
            <div class="smcs-category-list">
                <div class="smcs-category-item" data-category="fruitsVegetables" id="fruits_vegetables">
                    <i class="fas fa-apple-alt"></i> Fruits & Vegetables</div>
                <div class="smcs-category-item" data-category="staples" id="staples">
                    <i class="fas fa-utensils"></i> Staples</div>
                <div class="smcs-category-item" data-category="snacks" id="snacks">
                    <i class="fas fa-cookie"></i> Snacks & Namkeens</div>
                <div class="smcs-category-item" data-category="beverages" id="beverages">
                    <i class="fas fa-coffee"></i> Beverages</div>
                <div class="smcs-category-item" data-category="dairy" id="dairy">
                    <i class="fas fa-cheese"></i> Chilled & Dairy Foods</div>
                <div class="smcs-category-item" data-category="readyCook" id="ready_to_cook">
                    <i class="fas fa-fire"></i> Ready To Cook</div>
                <div class="smcs-category-item" data-category="readyEat" id="ready_to_eat">
                    <i class="fas fa-utensil-spoon"></i> Ready To Eat</div>
                <div class="smcs-category-item" data-category="babyCare" id="baby_care">
                    <i class="fas fa-baby"></i> Baby Care</div>
                <div class="smcs-category-item" data-category="household" id="household">
                    <i class="fas fa-home"></i> Household</div>
                <div class="smcs-category-item" data-category="feminineCare" id="feminine_care">
                    <i class="fas fa-female"></i> Feminine Care</div>
                <div class="smcs-category-item" data-category="cleaning" id="cleaning">
                    <i class="fas fa-soap"></i> Cleaning Needs</div>
                <div class="smcs-category-item" data-category="personalCare" id="personal_care">
                    <i class="fas fa-hand-holding-water"></i> Personal Care</div>
                <div class="smcs-category-item" data-category="healthCare" class="health_care">
                    <i class="fas fa-heartbeat"></i> Health Care</div>
                <div class="smcs-category-item" data-category="crockeries" id="crockeries">
                    <i class="fas fa-utensils"></i> Crockeries</div>
            </div>
        </div>

        <!-- Product Display Section -->
        <div class="col-md-9">
            <h4 id="category-title" class="text-success">Select a Category</h4>
            <div class="row product-container" id="product-list">
                <!-- Products will be dynamically added here -->
            </div>
        </div>
    </div>
</template>
