<!---top navigation template-->
<template id="sm_supermarket_top_navigation_template">
    <div class="container-fluid p-0 d-flex justify-content-between">
        <!-- Logo -->
        <a class="navbar-brand text-white d-flex align-items-center" href="dashboard.html">
            <img src="../../Public/Assests/Images/supermarket logo.jpg" alt="logo" class="logo-image">
            <span class="brand-text">FOOD<span class="orange-text">HUB</span></span>
        </a>
        <!-- Search Bar -->
        <div class="search-bar">
            <input class="form-control" type="search" placeholder="Search for vegetables, fruits....." aria-label="Search">
            <i class='fas fa-search search-icon'></i>
        </div>
        <!-- Cart & Avatar -->
        <div class="d-flex align-items-center ms-3 me-4">   
        <!-- Cart Icon with Badge -->
        <div class="cart-container position-relative">
            <i class="fa-solid fa-cart-shopping text-white fs-4"></i>
            <span class="position-absolute cart-badge badge bg-danger rounded-pill">0</span>
        <!-- Cart Preview -->
        <div id="cartPreview" class="cart-preview">
            <img src="" alt="Cart Icon" class="cart-icon"> <!-- Small cart image -->
            <p>You have no items in your shopping cart</p>
            <button class="btn btn-start-shopping">Start Shopping</button>
        </div>
        </div>

            <!-- Avatar Icon -->
            <div class="avatar-icon  top-0 right-0 ms-3" id="avatarIcon">
                <i class="fa-solid fa-user text-dark fs-5"></i>
            </div>
            <!-- Profile Card (Initially Hidden) -->
            <div id="profileCard">
                <div class="profile-card-content">
                    <img src="../../Public/Assests/Images/general user icon.jpg" class="profile-pic" alt="User Avatar">
                    <h5 class="user-name"></h5>
                    <button id="logout_button" class="btn btn-logout mt-2">Logout</button>                        
               </div>
            </div>
        </div>
    </div>
</template>

<!--- customer register and update form template-->
<template id="sm_supermarket_customer_information_template">
    <div class="row">
        <div class="col-md-4">
            <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
            <input type="text" id="firstName" name="firstName" class="form-control"
                placeholder="First Name">
        </div>
        <div class="col-md-4">
            <label for="middleName" class="form-label">Middle Name</label>
            <input type="text" id="middleName" name="middleName" class="form-control"
                placeholder="Middle Name">
        </div>
        <div class="col-md-4">
            <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
            <input type="text" id="lastName" name="lastName" class="form-control"
                placeholder="Last Name">
        </div>
    </div>
    <!-- Additional Information Panel -->
    <div class="panel mt-sm-3">
        <a class="panel-header d-flex" data-bs-toggle="collapse" href="#additionalInfoPanel"
            role="button" aria-expanded="false" aria-controls="additionalInfoPanel">
            <span class="toggle-icon">+</span> Additional Information
        </a>
        <div id="additionalInfoPanel" class="collapse panel-content">
            <div class="row">
                <div class="col-md-6">
                    <label for="customer_email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="text" id="customer_email" name="customerEmail" class="form-control"
                        placeholder="Email">
                </div>
                <div class="col-md-6">
                    <label for="customer_confirm_email" class="form-label">Confirm Email <span class="text-danger">*</span></label>
                    <input type="text" id="customer_confirm_email" name="customerConfirmEmail"
                        class="form-control" placeholder="Confirm Email">
                </div>
            </div>
            <div class="row pt-2">
                <div class="col-md-6">
                    <label for="customer_password" class="form-label">Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" id="customer_password" name="customerPassword" class="form-control" placeholder="Password">
                        <span class="input-group-text">
                            <i class="fa fa-eye" id="togglePassword"></i>
                        </span>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="customer_confirm_password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" id="customer_confirm_password" name="customerConfirmPassword" class="form-control" placeholder="Password">
                        <span class="input-group-text">
                            <i class="fa fa-eye" id="toggleConfirmPassword"></i>
                        </span>
                    </div>
                </div>                                
            </div>
            <div class="row pt-2">
                <div class="col-md-6">
                    <label for="mobileNo" class="form-label">Mobile Phone <span class="text-danger">*</span></label>
                    <input type="text" id="mobileNo" name="customerMobileNo" class="form-control"
                        placeholder="Mobile Phone">
                </div>
            </div>
        </div>
    </div>
    <!-- customer Address Panel -->
    <div class="panel mt-2">
        <a class="panel-header d-flex" data-bs-toggle="collapse" href="#customerAddressPanel"
            role="button" aria-expanded="false" aria-controls="customerAddressPanel">
            <span class="toggle-icon">+</span> Customer Address
         </a>  
         <!-- toggle class --> 
        <div id="customerAddressPanel" class="collapse panel-content">
            <div class="row">
                <div class="col-md-4">
                    <label for="address_line_one" class="form-label">Address Line One <span class="text-danger">*</span></label>
                    <input type="text" id="address_line_one" name="customerAddressLineOne" class="form-control mb-2"
                        placeholder="Address Line One">
                </div>
                <div class="col-md-4">
                    <label for="address_line_two" class="form-label">Address Line Two <span class="text-danger">*</span></label>
                    <input type="text" id="address_line_two" name="customerAddressLineTwo" class="form-control mb-2"
                        placeholder="Address Line Two">
                </div>
                <div class="col-md-4">
                    <label for="city" class="form-label">City <span class="text-danger">*</span></label>
                    <input type="text" id="city" name="customerCity" class="form-control mb-2"
                        placeholder="City">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <label for="state" class="form-label " name="customerState">State <span class="text-danger">*</span></label>
                    <select id="state" class="form-control form-select mb-2">
                        <option value="">State</option>

                        <option value="IN">Indiana</option>
                        <option value="IA">Iowa</option>

                        <option value="MD">Maryland</option>
                        <option value="MA">Massachusetts</option>
                        <option value="MI">Michigan</option>
                        <option value="MN">Minnesota</option>

                </div>

                    <label for="zipcode" class="form-label">ZipCode <span class="text-danger">*</span></label>
                    <input type="text" class="form-control mb-2" placeholder="ZipCode" id="zipcode" name="customerPincode">
                </div>
                <div class="col-md-4">
                    <label for="country" class="form-label">Country <span class="text-danger">*</span></label>
                    <input type="text" id="country" name="customerCountry" class="form-control mb-2" value="USA" disabled>
                </div>
            </div>
        </div>
    </div>
</div>
</template>
