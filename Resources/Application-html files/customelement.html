<!---top navigation template-->
<template id="sm_supermarket_top_navigation_template">
    <div class="container-fluid p-0 d-flex justify-content-between">
        <!-- Logo -->
        <a class="navbar-brand text-white d-flex align-items-center" href="#">
            <img src="../../Public/Assests/Images/supermarket logo.jpg" alt="logo" class="logo-image">
            <span class="brand-text">FOOD<span class="orange-text">HUB</span></span>
        </a>
        <!-- Search Bar -->
        <div class="search-bar">
            <input class="form-control" type="search" placeholder="Search for vegetables, fruits....." aria-label="Search">
            <i class='fas fa-search search-icon'></i>
        </div>
        <!-- Cart & Avatar -->
        <div class="d-flex align-items-center ms-3 me-4">
            <!-- Cart Icon with Badge -->
            <div class="cart-container">
                <i class="fa-solid fa-cart-shopping text-white fs-4"></i>
                <span class="position-absolute cart-badge badge bg-danger rounded-pill">0</span>
            </div>
            <!-- Avatar Icon -->
            <div class="avatar-icon  top-0 right-0 ms-3" id="avatarIcon">
                <i class="fa-solid fa-user text-dark fs-5"></i>
            </div>
            <!-- Profile Card (Initially Hidden) -->
            <div id="profileCard">
                <div class="profile-card-content">
                    <img src="../../Public/Assests/Images/general user icon.jpg" class="profile-pic" alt="User Avatar">
                    <h5 class="user-name"></h5>
                    <button id="logout_button" class="btn btn-logout mt-2">Logout</button>                        
               </div>
            </div>
        </div>
    </div>
</template>

<!--- cuastomer register and update form template-->
<template id="sm_supermarket_customer_information_template">
    <div class="row">
        <div class="col-md-4">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" id="firstName" name="firstName" class="form-control"
                placeholder="First Name">
        </div>
        <div class="col-md-4">
            <label for="middleName" class="form-label">Middle Name</label>
            <input type="text" id="middleName" name="middleName" class="form-control"
                placeholder="Middle Name">
        </div>
        <div class="col-md-4">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" id="lastName" name="lastName" class="form-control"
                placeholder="Last Name">
        </div>
    </div>
    <!-- Additional Information Panel -->
    <div class="panel mt-sm-3">
        <a class="panel-header d-flex" data-bs-toggle="collapse" href="#additionalInfoPanel"
            role="button" aria-expanded="false" aria-controls="additionalInfoPanel">
            <span class="toggle-icon">+</span> Additional Information
        </a>
        <div id="additionalInfoPanel" class="collapse panel-content">
            <div class="row">
                <div class="col-md-6">
                    <label for="customer_email" class="form-label">Email</label>
                    <input type="text" id="customer_email" name="customer_email" class="form-control"
                        placeholder="Email">
                </div>
                <div class="col-md-6">
                    <label for="customer_confirm_email" class="form-label">Confirm Email</label>
                    <input type="text" id="customer_confirm_email" name="customer_confirm_email"
                        class="form-control" placeholder="Confirm Email">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label for="customer_password" class="form-label">Password</label>
                    <input type="text" id="customer_password" name="customer_password"
                        class="form-control" placeholder="Password">
                </div>
                <div class="col-md-6">
                    <label for="customer_confirm_password" class="form-label">Confirm Password</label>
                    <input type="text" id="customer_confirm_password" name="customer_confirm_password"class="form-control" placeholder="Password">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label for="mobileNo" class="form-label">Mobile Phone</label>
                    <input type="text" id="mobileNo" name="mobileNo" class="form-control"
                        placeholder="Mobile Phone">
                </div>
            </div>
        </div>
    </div>

    <!-- Patient Address Panel -->
    <div class="panel mt-2">
        <a class="panel-header d-flex" data-bs-toggle="collapse" href="#patientAddressPanel"
            role="button" aria-expanded="false" aria-controls="patientAddressPanel">
            <span class="toggle-icon">+</span> Patient Address
        </a>
        <div id="patientAddressPanel" class="collapse panel-content">
            <div class="row">
                <div class="col-md-4">
                    <label for="address_one" class="form-label">Address Line One</label>
                    <input type="text" id="address_one" name="address_one" class="form-control mb-2"
                        placeholder="Address Line One">
                </div>
                <div class="col-md-4">
                    <label for="address_two" class="form-label">Address Line Two</label>
                    <input type="text" id="address_two" name="address_two" class="form-control mb-2"
                        placeholder="Address Line Two">
                </div>
                <div class="col-md-4">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" name="city" class="form-control mb-2"
                        placeholder="City">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <label for="state" class="form-label" name="state">State</label>
                    <select class="form-control mb-2">
                        <option value="">State</option>

                        <option value="ID">Idaho</option>

                        <option value="IN">Indiana</option>
                        <option value="IA">Iowa</option>
                        <option value="KS">Kansas</option>
                        <option value="KY">Kentucky</option>
                        <option value="LA">Louisiana</option>
                        <option value="ME">Maine</option>
                        <option value="MH">Marshall Islands</option>
                        <option value="MD">Maryland</option>
                        <option value="MA">Massachusetts</option>
                        <option value="MI">Michigan</option>
                        <option value="MN">Minnesota</option>
                        <option value="MS">Mississippi</option>
                        <option value="MO">Missouri</option>
                        <option value="MT">Montana</option>
                        <option value="NE">Nebraska</option>
